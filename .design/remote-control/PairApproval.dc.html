<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
           font-synthesis: none; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #8fd6c7; } a:hover { color: #6cae9d; }
  </style>
</helmet>
<div style="width: 520px; height: 360px; display: flex; align-items: center; justify-content: center; background: #0d0f10; box-sizing: border-box;">
  <div style="width: 400px; border: 1px solid #3b4447; border-radius: 8px; background: #1b2022; box-shadow: 0 22px 70px rgba(0,0,0,0.5); overflow: hidden; color: #e7e7e2;">

    <div style="display: flex; gap: 13px; padding: 18px 18px 14px;">
      <div style="width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #243430;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fd6c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"></rect><path d="M12 18h.01"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 700; color: #f4f3ec;">Pair &ldquo;Ray&rsquo;s iPhone&rdquo;?</span>
        <span style="font-size: 12px; line-height: 1.55; color: #b9c0bc;">
          It will see every terminal in this workspace and be able to send input, queue turns, and answer permission prompts.
        </span>
      </div>
    </div>

    <div style="margin: 0 18px 14px; padding: 11px 13px; border: 1px solid rgba(255,255,255,0.065); border-radius: 6px; background: #15191b;">
      <div style="display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px;">
        <span style="font-size: 11px; color: #8a938e;">Device key</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #c4cbc6;">k51qzi5u&hellip;9wfvzqd2</span>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 12px;">
        <span style="font-size: 11px; color: #8a938e;">Connected via</span>
        <span style="font-size: 11px; color: #c4cbc6;">Direct &middot; 192.168.1.44</span>
      </div>
    </div>

    <div style="margin: 0 18px 16px; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid rgba(215,168,79,0.42); border-radius: 6px; background: rgba(215,168,79,0.08);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d7a84f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>
      <span style="font-size: 11.5px; line-height: 1.45; color: #d8b878;">Only approve this if you are holding the phone that just scanned the code.</span>
    </div>

    <div style="height: 1px; background: #2a2d2f;"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px;">
      <label style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #b9c0bc;">
        <span style="width: 13px; height: 13px; border: 1px solid #3a3d3f; border-radius: 3px; background: #24282b;"></span>
        Read only
      </label>
      <div style="display: flex; gap: 8px;">
        <div style="display: flex; align-items: center; padding: 0 13px; height: 30px; border: 1px solid #3a3d3f; border-radius: 6px; background: #24282b; font-size: 13px; color: #f1f0e8;">Deny</div>
        <div style="display: flex; align-items: center; padding: 0 13px; height: 30px; border: 1px solid #6cae9d; border-radius: 6px; background: #243430; font-size: 13px; font-weight: 500; color: #8fd6c7;">Pair</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
