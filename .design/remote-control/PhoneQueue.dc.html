<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
           font-synthesis: none; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #8fd6c7; } a:hover { color: #6cae9d; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #171b1d; color: #e7e7e2; box-sizing: border-box; overflow: hidden;">

  <div style="height: 56px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; gap: 10px; height: 48px; flex-shrink: 0; padding: 0 12px 0 8px; border-bottom: 1px solid #2a2d2f; background: #14171a;">
    <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8fd6c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 15px; font-weight: 500; color: #f1f0e8;">Queue</span>
      <span style="font-size: 11.5px; color: #8a938e;">pairing flow &middot; 3 turns</span>
    </div>
    <span style="padding-right: 6px; font-size: 14.5px; color: #8fd6c7;">Done</span>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid rgba(215,168,79,0.42); border-radius: 12px; background: rgba(215,168,79,0.08);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#d7a84f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span style="flex: 1; font-size: 13.5px; color: #d8b878;">Sending when the agent goes idle</span>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid #384246; border-radius: 12px; background: #1b2022;">
      <div style="width: 22px; flex-shrink: 0; padding-top: 2px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="18" r="1"></circle><circle cx="15" cy="6" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="18" r="1"></circle></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 14.5px; line-height: 1.5; color: #e7e7e2;">Now wire the resync frame into the session loop</span>
        <span style="font-size: 12px; color: #6f7773;">Next up</span>
      </div>
      <div style="width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid #384246; border-radius: 12px; background: #1b2022;">
      <div style="width: 22px; flex-shrink: 0; padding-top: 2px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="18" r="1"></circle><circle cx="15" cy="6" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="18" r="1"></circle></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 14.5px; line-height: 1.5; color: #e7e7e2;">Run the full rust suite and fix whatever the ring broke</span>
      </div>
      <div style="width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px dashed rgba(109,167,236,0.5); border-radius: 12px; background: rgba(109,167,236,0.08);">
      <div style="width: 22px; flex-shrink: 0; padding-top: 2px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6da7ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 14.5px; line-height: 1.5; color: #e7e7e2;">Then open the PR</span>
        <span style="font-size: 12px; color: #6da7ec;">Waits for &ldquo;remote transport&rdquo;</span>
      </div>
      <div style="width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </div>
    </div>

  </div>

  <div style="display: flex; gap: 10px; flex-shrink: 0; padding: 12px 16px 40px; border-top: 1px solid #2a2d2f; background: #14171a;">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border: 1px solid #3a3d3f; border-radius: 12px; background: #24282b;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c4cbc6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
      <span style="font-size: 15px; color: #f1f0e8;">Pause queue</span>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border: 1px solid #6cae9d; border-radius: 12px; background: #243430;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8fd6c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      <span style="font-size: 15px; color: #8fd6c7;">Send next</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
