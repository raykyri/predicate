<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
           font-synthesis: none; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #8fd6c7; } a:hover { color: #6cae9d; }
  </style>
</helmet>
<div style="width: 420px; height: 540px; padding: 18px; box-sizing: border-box; background: #0f1112; color: #e7e7e2; font-size: 13px;">

  <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
    <div style="display: flex;">
      <div style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px 0 0 6px; color: #8a938e;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
      </div>
      <div style="width: 24px; height: 24px; margin-left: -1px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.045); color: #8fd6c7;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"></rect><path d="M12 18h.01"></path></svg>
      </div>
      <div style="width: 24px; height: 24px; margin-left: -1px; display: flex; align-items: center; justify-content: center; border-radius: 0 6px 6px 0; color: #8a938e;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m16 15-3-3 3-3"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; width: 344px; margin-left: auto; border: 1px solid #2a2d2f; border-radius: 8px; background: #1d2224; box-shadow: 0 10px 28px rgba(0,0,0,0.5); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px;">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 13px; font-weight: 700; color: #f4f3ec;">Remote control</span>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8fd6c7;">
          <span style="width: 6px; height: 6px; border-radius: 999px; background: #8fd6c7;"></span>
          1 device connected
        </span>
      </div>
      <div style="width: 34px; height: 20px; flex-shrink: 0; display: flex; justify-content: flex-end; padding: 2px; border-radius: 999px; background: #243430; border: 1px solid #6cae9d; box-sizing: border-box;">
        <div style="width: 14px; height: 14px; border-radius: 999px; background: #8fd6c7;"></div>
      </div>
    </div>

    <div style="height: 1px; background: #2a2d2f;"></div>

    <div style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 2px; margin: 12px 14px 14px; padding: 3px; border: 1px solid rgba(255,255,255,0.075); border-radius: 8px; background: rgba(0,0,0,0.18);">
      <div style="display: flex; align-items: center; justify-content: center; min-height: 24px; border-radius: 6px; background: #2c3134; color: #f1f0e8; font-size: 12px; font-weight: 500;">This network</div>
      <div style="display: flex; align-items: center; justify-content: center; min-height: 24px; border-radius: 6px; color: #8a938e; font-size: 12px; font-weight: 500;">Anywhere</div>
    </div>

    <div style="padding: 0 14px 4px;">
      <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6f7773;">Paired devices</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 10px 12px;">

      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid rgba(143,214,199,0.30); border-radius: 6px; background: rgba(143,214,199,0.08);">
        <span style="width: 7px; height: 7px; flex-shrink: 0; border-radius: 999px; background: #8fd6c7;"></span>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;">
          <span style="font-size: 12.5px; color: #f1f0e8;">Ray&rsquo;s iPhone</span>
          <span style="font-size: 11px; color: #8a938e;">Connected &middot; direct &middot; 4 panes open</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid transparent; border-radius: 6px;">
        <span style="width: 7px; height: 7px; flex-shrink: 0; border-radius: 999px; background: #3a4245;"></span>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;">
          <span style="font-size: 12.5px; color: #c4cbc6;">iPad mini</span>
          <span style="font-size: 11px; color: #8a938e;">Last seen 3 days ago &middot; read only</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6f7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 9px 10px; border: 1px dashed #3a3d3f; border-radius: 6px; color: #8a938e;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        <span style="font-size: 12px;">Pair a new device</span>
      </div>

    </div>

    <div style="height: 1px; background: #2a2d2f;"></div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px;">
      <div style="width: 13px; height: 13px; display: flex; align-items: center; justify-content: center; border: 1px solid #6cae9d; border-radius: 3px; background: #243430;">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#8fd6c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <span style="font-size: 12px; color: #b9c0bc;">Turn on when qmux launches</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
